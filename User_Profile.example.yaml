# User_Profile.example.yaml
# Copy to `User_Profile.yaml` (ignored by git) and fill in for your machine.
# The spine loads user preferences before routing/answering.

user:
  name: <your name>

preferences:
  architecture_style:
    - provider neutral
    - platform first

  preferred_outputs:
    - markdown
    - diagrams
    - implementation plans

  focus_areas:
    - transformation
    - enterprise ai
    - agent platforms

decision_patterns:
  - avoid lock in
  - favour extensibility
